<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Curses & Wishes 🔮</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./cause.css">
</head>
<body>
    <!-- Ghost Custom Cursor -->
    <div id="ghost-cursor" class="ghost-cursor">
        <svg viewBox="0 0 36 36" class="ghost-svg">

            <circle cx="13" cy="13" r="2" fill="#0a0612"/>
            <circle cx="23" cy="13" r="2" fill="#0a0612"/>
            <path d="M16 18c1 1.5 3 1.5 4 0" stroke="#0a0612" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
    </div>

    <div class="container">
        <h1>Dr. Ghost's Birthday Spells 🔮</h1>
        
        <div id="reasons-container"></div>
        
        <button class="shuffle-button">Brew Potion... 🔮✨</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <img src="./c1.JPG" alt="Ghost Bestie Moment" onerror="this.src='https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&q=80'">
            </div>
            <div class="ending-text">You're the most ICONIC PHANTOM FRIEND! 🏆👻</div>
        </div>
    </div>

    <script src="./cause.js"></script>
</body>
</html>
